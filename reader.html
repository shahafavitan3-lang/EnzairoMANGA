<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta name="theme-color" content="#05070b">
    <meta name="description" content="Read Enzairo Volume 1 — The Beginning.">

    <title>Enzairo — Volume 01</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="reader-body">

    <!-- READER HEADER -->

    <header class="reader-header">

        <a href="index.html" class="reader-logo">
            ENZAIRO
        </a>

        <div class="reader-title">

            <span data-i18n="readerVolume">
                VOLUME 01
            </span>

            <strong data-i18n="readerBeginning">
                THE BEGINNING
            </strong>

        </div>


        <div class="reader-actions">

            <button id="languageBtn" class="language-button" type="button" aria-label="Change language">
                עברית
            </button>

            <a href="index.html" class="close-reader">
                ×
            </a>

        </div>

    </header>


    <!-- READER -->

    <main class="reader">

        <div class="reader-top">

            <p data-i18n="reading">
                READING VOLUME 01
            </p>

            <span id="pageCounter">
                1 / 20
            </span>

        </div>


        <div class="manga-container">

            <button
                id="prevBtn"
                class="reader-arrow left"
                aria-label="Previous page" type="button"
            >
                ←
            </button>


            <div class="page-wrapper">

                <img
                    id="mangaPage"
                    src="pages/page-01.png"
                    alt="Manga page 1"
                >

            </div>


            <button
                id="nextBtn"
                class="reader-arrow right"
                aria-label="Next page" type="button"
            >
                →
            </button>

        </div>


        <div class="reader-bottom">

            <button id="firstBtn" data-i18n="first" type="button">
                FIRST
            </button>

            <div class="progress">

                <div
                    id="progressBar"
                    class="progress-fill"
                ></div>

            </div>

            <button id="lastBtn" data-i18n="last" type="button">
                LAST
            </button>

        </div>


        <p class="reader-hint" data-i18n="readerHint">
            Use the arrows or your keyboard to turn the pages.
        </p>

    </main>


    <script src="reader.js"></script>

</body>

</html>
